<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entregas - MAMBO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/admin/pedidos.css}" />
  <link rel="stylesheet" th:href="@{/css/admin/navbar.css}" />
</head>

<body>
  <div th:replace="admin/fragments/navbar :: navbar"></div>

  <main class="main-content p-4">
    <div class="container-fluid">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 style="font-weight:800">ENTREGAS MAMBO</h4>
          <p class="text-secondary m-0">Gestión de pedidos y despachos</p>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-start gap-3 flex-wrap filtros-bar mb-4">
        <div>
          <label class="fw-semibold small mb-1">Estado</label>
          <select class="form-select rounded-2 filtro-select" id="filtroEstado">
            <option value="todos">Todos</option>
            <option value="COMPLETADO">Completado</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>

        <div class="flex-grow-1">
          <label class="fw-semibold small mb-1">Buscar</label>
          <div class="search-box position-relative">
            <input type="text" id="buscador" class="form-control rounded-2 ps-4" placeholder="Buscar por cliente o DNI..." />
            <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y pe-3 text-secondary"></i>
          </div>
        </div>
      </div>

      <div class="table-responsive rounded-4 mt-2">
        <table class="table align-middle mb-0 table-hover">
          <thead class="table-light">
            <tr class="text-uppercase small text-secondary">
              <th>ID</th>
              <th>CLIENTE</th>
              <th>DOCUMENTO</th>
              <th>FECHA</th>
              <th>TOTAL</th>
              <th>ESTADO</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tablaPedidosBody">
            
            <tr th:each="pedido : ${listaPedidos}">
              <td><span class="fw-bold" th:text="'#' + ${pedido.id}">#1</span></td>
              
              <td>
                <div class="fw-bold" th:text="${pedido.cliente.nombres} + ' ' + ${pedido.cliente.apellidos}">Juan</div>
                <small class="text-muted" th:text="${pedido.cliente.correo}">email</small>
              </td>
              
              <td th:text="${pedido.cliente.nIdentificacion}">12345678</td>
              
              <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
              
              <td class="fw-bold" th:text="'S/. ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">Total</td>
              
              <td>
                <span class="badge" 
                      th:classappend="${pedido.estado == 'COMPLETADO' ? 'bg-success' : (pedido.estado == 'PENDIENTE' ? 'bg-warning text-dark' : 'bg-danger')}"
                      th:text="${pedido.estado}">Estado</span>
              </td>
              
              <td>
                <button class="btn btn-sm btn-outline-dark btn-observar" 
                        data-bs-toggle="modal" 
                        data-bs-target="#detalleModal"
                        th:data-id="${pedido.id}">
                  <i class="bi bi-eye me-1"></i>Observar
                </button>
              </td>
            </tr>

            <tr th:if="${#lists.isEmpty(listaPedidos)}">
                <td colspan="7" class="text-center py-5 text-muted">No hay pedidos registrados</td>
            </tr>

          </tbody>
        </table>
      </div>

    </div>
  </main>

  <div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">Detalle del Pedido #<span id="modalPedidoId"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>SKU</th>
                  <th>Producto</th>
                  <th class="text-center">Cant.</th>
                  <th class="text-end">P. Unit</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="detallePedidoBody">
                <tr><td colspan="5" class="text-center">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="text-end mt-3 border-top pt-2">
            <h5 class="fw-bold">Total: <span id="detalleTotal">S/. 0.00</span></h5>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cerrar</button>
          <button class="btn btn-dark"><i class="bi bi-printer me-2"></i>Imprimir</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // 1. FILTRADO LOCAL (Buscador)
      const inputBuscar = document.getElementById("buscador");
      const selectEstado = document.getElementById("filtroEstado");
      const filas = document.querySelectorAll("#tablaPedidosBody tr");

      function filtrar() {
        const texto = inputBuscar.value.toLowerCase();
        const estado = selectEstado.value;

        filas.forEach(fila => {
          const textoFila = fila.innerText.toLowerCase();
          const estadoFila = fila.querySelector(".badge")?.innerText || "";
          
          const coincideTexto = textoFila.includes(texto);
          const coincideEstado = estado === "todos" || estadoFila === estado;

          fila.style.display = (coincideTexto && coincideEstado) ? "" : "none";
        });
      }

      inputBuscar.addEventListener("keyup", filtrar);
      selectEstado.addEventListener("change", filtrar);

      // 2. MODAL DETALLES (Fetch API)
      const modal = document.getElementById('detalleModal');
      const tbody = document.getElementById('detallePedidoBody');
      const totalSpan = document.getElementById('detalleTotal');
      const idSpan = document.getElementById('modalPedidoId');

      modal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const idPedido = button.getAttribute('data-id');
        
        idSpan.textContent = idPedido;
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Cargando...</td></tr>';

        // Llamada al Backend
        fetch(`/api/pedidos/${idPedido}/detalles`)
          .then(res => res.json())
          .then(data => {
            tbody.innerHTML = "";
            let total = 0;

            if(data.length === 0) {
               tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay detalles disponibles</td></tr>';
               return;
            }

            data.forEach(item => {
              total += item.subtotal;
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td><span class="badge bg-light text-dark border">${item.sku || 'N/A'}</span></td>
                <td class="fw-semibold">${item.nombre}</td>
                <td class="text-center">${item.cantidad}</td>
                <td class="text-end">S/. ${item.precio.toFixed(2)}</td>
                <td class="text-end fw-bold">S/. ${item.subtotal.toFixed(2)}</td>
              `;
              tbody.appendChild(tr);
            });
            totalSpan.textContent = `S/. ${total.toFixed(2)}`;
          })
          .catch(err => {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error al cargar detalles</td></tr>';
            console.error(err);
          });
      });

    });
  </script>
</body>
</html>
