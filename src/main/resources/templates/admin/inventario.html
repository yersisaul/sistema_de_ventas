<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario - MAMBO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/admin/inventario.css}" />
  <link rel="stylesheet" th:href="@{/css/admin/navbar.css}" />
</head>
<body>
  <!-- Navbar frag (asegúrate que existe) -->
  <div th:replace="admin/fragments/navbar :: navbar"></div>

  <main class="main-content p-4">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 style="font-weight:800">INVENTARIO DE PRODUCTOS</h4>
          <p class="text-secondary mb-0">Lista general + stock por talla</p>
        </div>
        <div class="d-flex gap-2">
          <input type="text" class="form-control buscador rounded-2" placeholder="Buscar producto...">
          <button class="btn btn-outline-dark rounded-2">NUEVO PRODUCTO</button>
        </div>
      </div>

      <!-- Tabla principal: columnas generales + columnas de tallas -->
      <!-- EJEMPLO ESTÁTICO (más abajo incluyo ejemplo dinámico con th:each) -->
      <div class="table-responsive rounded-4 p-2">
        <table class="table align-middle mb-0 inventory-table">
          <thead>
            <tr class="text-uppercase small text-secondary">
              <!-- columnas generales -->
              <th class="gen-col">Producto</th>
              <th class="gen-col">Descripción</th>
              <th class="gen-col">Categoría</th>
              <th class="gen-col">Precio</th>
              <!-- columnas de tallas (puedes poner las tallas que uses) -->
              <th class="size-col">XS</th>
              <th class="size-col">S</th>
              <th class="size-col">M</th>
              <th class="size-col">L</th>
              <th class="size-col">XL</th>
              <th class="gen-col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- fila ejemplo -->
            <tr>
              <td class="fw-semibold">Polo Básico</td>
              <td>Algodón slim fit</td>
              <td>Ropa</td>
              <td>S/. 39.90</td>

              <!-- stock por talla -->
              <td class="text-center"><span class="stock">5</span></td>
              <td class="text-center"><span class="stock">12</span></td>
              <td class="text-center"><span class="stock">8</span></td>
              <td class="text-center"><span class="stock">3</span></td>
              <td class="text-center"><span class="stock">0</span></td>

              <td>
                <a href="#" class="text-dark fw-semibold">Editar</a>
                <i class="bi bi-pencil-square ms-2"></i>
              </td>
            </tr>

            <tr>
              <td class="fw-semibold">Zapatillas Urbanas</td>
              <td>Suela EVA, exterior textil</td>
              <td>Calzado</td>
              <td>S/. 159.00</td>

              <td class="text-center"><span class="stock">0</span></td>
              <td class="text-center"><span class="stock">2</span></td>
              <td class="text-center"><span class="stock">6</span></td>
              <td class="text-center"><span class="stock">9</span></td>
              <td class="text-center"><span class="stock">4</span></td>

              <td>
                <a href="#" class="text-dark fw-semibold">Editar</a>
                <i class="bi bi-pencil-square ms-2"></i>
              </td>
            </tr>

            <!-- Puedes duplicar filas o usar la versión dinámica con Thymeleaf -->
          </tbody>
        </table>
      </div>

    </div>
  </main>
</body>
</html>
