<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Mambo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <link rel="stylesheet" th:href="@{/css/client/base.css}">
    <link rel="stylesheet" th:href="@{/css/client/home.css}">
</head>
<body>
    <header th:replace="client/fragments/navbar :: navbar"></header>

    <section class="hero-section text-white d-flex align-items-center">
        <div class="container-fluid px-5">
            <div class="row">
                <div class="col-lg-6 col-md-12 hero-text-content">
                    <h1 class="display-1 fw-bold mb-3">MAMBO</h1>
                    <H2 class="display-4 fw-normal mb-4">CLOTHING</H2>
                    <P class="lead mb-4">Tu estilo no se copia se crea, comienza eligiendo a MAMBO</P>
                    <a th:href="@{/client/productos}" class="btn boton">
                    COMIENZA A ELEGIR
                </a>
                </div>
                <div class="col-lg-6 d-none d-lg-block hero-image-col">
                    </div>
            </div>
        </div>
    </section>

    <div th:replace="client/fragments/navbar :: loginModal"></div>
    <div th:replace="client/fragments/navbar :: registerModal"></div>
    <div th:replace="client/fragments/navbar :: carritoOffcanvas"></div>

    <footer th:replace="client/fragments/footer :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
