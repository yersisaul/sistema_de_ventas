<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración de Perfil - MAMBO</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}"> 
    
    <style>
        /* Ajuste para el sidebar del cliente */
        .main-content { 
            margin-left: 100px; 
            padding: 2rem; 
            background-color: #f8f9fa; 
            min-height: 100vh; 
        }
        @media (max-width: 768px) { 
            .main-content { margin-left: 0; } 
        }
        .profile-card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-control:focus { border-color: #000; box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div th:replace="client/fragments/client_navbar :: client_navbar"></div>

    <main class="main-content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Configuración de Perfil</h2>
                    <p class="text-secondary mb-0">Edita tus datos personales y de contacto.</p>
                </div>
                <button class="btn btn-dark d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show" role="alert">
                ¡Perfil actualizado con éxito!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card profile-card p-4 p-lg-5" th:object="${usuario}">
                        <form th:action="@{/client/actualizar-perfil}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <h5 class="fw-bold mb-4 border-bottom pb-2">Datos Personales</h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="nombres" class="form-label fw-semibold">Nombres</label>
                                    <input type="text" class="form-control" id="nombres" th:field="*{nombres}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label fw-semibold">Apellidos</label>
                                    <input type="text" class="form-control" id="apellidos" th:field="*{apellidos}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="nIdentificacion" class="form-label fw-semibold">Documento (<span th:text="*{tipoIdentificacion}">DNI</span>)</label>
                                    <input type="text" class="form-control" th:field="*{nIdentificacion}" readonly style="background-color: #eee;">
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" class="form-control" th:field="*{correo}" readonly style="background-color: #eee;">
                                </div>
                            </div>

                            <h5 class="fw-bold mb-4 border-bottom pb-2 mt-5">Contacto y Dirección</h5>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="direccion" class="form-label fw-semibold">Dirección</label>
                                    <input type="text" class="form-control" id="direccion" th:field="*{direccion}" required>
                                </div>
                            </div>
                            
                            <div class="text-end mt-5">
                                <button type="submit" class="btn btn-dark px-5 py-2 fw-bold">GUARDAR CAMBIOS</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                 <a href="#" class="text-secondary small">Cambiar contraseña (No implementado)</a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
