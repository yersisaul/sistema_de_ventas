<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo - MAMBO</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" th:href="@{/css/client/base.css}" />
  <link rel="stylesheet" th:href="@{/css/client/productos.css}" />
  
  <style>
    /* ================= TEMA BLACK & YELLOW MAMBO ================= */
    :root {
        --bg-body: #000000;       /* Negro puro */
        --bg-card: #111111;       /* Gris carbón muy oscuro */
        --accent-primary: #FFD700; /* Amarillo Oro (Principal) */
        --accent-secondary: #00c6ff; /* Azul Cian (Detalles sutiles) */
        --text-main: #ffffff;
        --text-muted: #888888;
        --border-color: #222222;
    }

    body {
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* === DISEÑO DE TARJETAS (CARDS) === */
    .card-clean {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 0px; /* Bordes más rectos, estilo industrial */
        transition: all 0.3s ease;
    }

    .card-clean:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 20px rgba(255, 215, 0, 0.15); /* Resplandor amarillo */
        border-color: var(--accent-primary);
    }

    /* Corrección de Imágenes en Cards */
    .card-img-wrapper {
        position: relative;
        width: 100%;
        padding-top: 133%; /* Ratio 3:4 */
        background-color: #050505;
        border-bottom: 1px solid var(--border-color);
    }

    .card-img-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
        filter: grayscale(20%); /* Un toque desaturado inicial */
    }

    .card-clean:hover .card-img-wrapper img {
        transform: scale(1.03);
        filter: grayscale(0%); /* Color completo al hover */
    }

    /* === PRECIOS Y TEXTOS === */
    .price-tag {
        color: var(--accent-primary);
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    .text-muted { color: var(--text-muted) !important; }

    /* === BOTONES === */
    .btn-mambo {
        background-color: transparent;
        border: 2px solid var(--accent-primary);
        color: var(--accent-primary);
        transition: all 0.3s;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.9rem;
        border-radius: 0px; /* Botones rectos */
    }

    .btn-mambo:hover {
        background-color: var(--accent-primary);
        color: #000; /* Texto negro sobre fondo amarillo */
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    /* === SIDEBAR Y INPUTS === */
    .filter-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }

    .form-control {
        background-color: #0a0a0a;
        border: 1px solid #333;
        color: white;
        border-radius: 4px;
    }

    .form-control:focus {
        background-color: #141414;
        border-color: var(--accent-primary);
        color: white;
        box-shadow: none;
    }
    
    .form-control::placeholder { color: #555; text-transform: uppercase; font-size: 0.8rem;}

    .input-group-text {
        background-color: #0a0a0a;
        border: 1px solid #333;
        color: var(--accent-primary);
    }

    /* === SELECTOR DE TALLAS (MODAL Y FILTRO) === */
    .talla-selector input[type="radio"] { display: none; }
    
    .talla-selector label { 
        cursor: pointer; transition: 0.2s; user-select: none; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; 
        border-radius: 4px;
        border: 2px solid #333; color: #888; background: #0a0a0a;
    }
    
    .talla-selector input:checked + label { 
        background-color: var(--accent-primary); color: #000; border-color: var(--accent-primary);
    }
    
    .talla-selector input:disabled + label { 
        background-color: #050505; color: #333; border-color: #222; cursor: not-allowed; text-decoration: line-through; 
    }

    /* Badges de filtro */
    .talla-badge { 
        cursor: pointer; user-select: none; padding: 8px 15px; 
        border: 1px solid #333; border-radius: 4px; background: #0a0a0a; color: #888;
        transition: 0.2s;
    }
    .talla-badge:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .talla-badge.active { 
        background-color: var(--accent-primary) !important; color: black !important; border-color: var(--accent-primary) !important; font-weight: bold;
    }

    /* === MODAL OSCURO === */
    .modal-content {
        background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color);
    }
    .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
    .modal-backdrop.show { opacity: 0.85; }

    /* Checkboxes y Switches */
    .form-check-input {
        background-color: #0a0a0a; border-color: #444;
    }
    .form-check-input:checked {
        background-color: var(--accent-primary); border-color: var(--accent-primary);
    }
    .form-switch .form-check-input { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23888'/%3e%3c/svg%3e"); }
    .form-switch .form-check-input:checked { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='3' fill='%23000'/%3e%3c/svg%3e"); }

    /* Enlaces secundarios (Azul) */
    .link-secondary-accent { color: var(--text-muted); text-decoration: none; transition: 0.2s;}
    .link-secondary-accent:hover { color: var(--accent-secondary); }
  </style>
</head>

<body>
  <header th:replace="~{client/fragments/navbar :: navbar}"></header>

  <section class="catalogo-section py-5">
    
    <div class="container mb-5 mt-3">
      <div class="row align-items-end fw-bold">
        <div class="col-lg-7">
          <h2 class="display-4 text-white m-0" style="font-weight: 900; letter-spacing: -1px; line-height: 0.9;">
            COLECCIÓN <br>
            <span style="color: var(--accent-primary); font-size: 1.2em;">URBANA 2025.</span>
          </h2>
        </div>
        <div class="col-lg-5 text-lg-end">
            <p class="text-muted mb-3">Define tu estilo. Domina las calles.</p>
          <div class="input-group">
            <input type="text" class="form-control border-end-0" placeholder="BUSCAR..." id="buscadorProductos" style="height: 50px;" />
            <span class="input-group-text bg-transparent border-start-0 text-white"><i class="bi bi-search"></i></span>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        
        <div class="col-lg-9 order-lg-2">
          
          <div class="row g-4" id="gridProductos">
            
            <div th:each="producto : ${listaProductos}" class="col-lg-3 col-md-4 col-6">
              
              <div class="card card-clean h-100 product-card-filter"
                   data-bs-toggle="modal"
                   th:data-bs-target="'#modalProducto-' + ${producto.id}"
                   th:data-nombre="${producto.nombre != null ? #strings.toLowerCase(producto.nombre) : ''}"
                   th:data-categoria="${producto.categoria != null ? producto.categoria.id : ''}"
                   th:data-tallas="${producto.variantes != null ? #strings.listJoin(producto.variantes.![talla], ',') : ''}"
                   th:data-precio="${producto.precioMinimo}"
                   th:data-stock="${(producto.variantes != null and !producto.variantes.empty) ? #aggregates.sum(producto.variantes.![stock]) : 0}">
                
                <div class="card-img-wrapper">
                  <img th:if="${producto.url_imagen != null and !producto.url_imagen.isEmpty()}" 
                       th:src="@{${producto.url_imagen}}" alt="Producto" />
                  
                  <img th:unless="${producto.url_imagen != null and !producto.url_imagen.isEmpty()}"
                       src="https://placehold.co/600x800/0a0a0a/333?text=MAMBO+N/A" alt="Producto" />
                       
                   <div th:if="${(producto.variantes == null or producto.variantes.empty) or (#aggregates.sum(producto.variantes.![stock]) == 0)}" 
                        class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-black bg-opacity-85">
                     <span class="badge bg-danger rounded-0 fs-6 px-3 py-2" style="letter-spacing: 2px;">AGOTADO</span>
                   </div>
                </div>

                <div class="card-body text-start d-flex flex-column p-3">
                  <p class="small mb-1 text-uppercase fw-bold" style="color: var(--accent-secondary);" th:text="${producto.categoria?.nombre}">Categoría</p>
                  <h6 class="card-title text-white text-uppercase mb-2 text-truncate" style="letter-spacing: 0.5px;" th:text="${producto.nombre}">NOMBRE</h6>
                  
                  <div class="mt-auto pt-2 d-flex justify-content-between align-items-center">
                    <h5 class="price-tag m-0">
                      <span th:if="${producto.variantes != null and !producto.variantes.empty}">
                        S/. <span th:text="${producto.precioMinimo}">0.00</span>
                      </span>
                      <span th:unless="${producto.variantes != null and !producto.variantes.empty}" class="text-muted fs-6">
                        SIN STOCK
                      </span>
                    </h5>
                    <button class="btn btn-sm btn-mambo rounded-0 px-3"><i class="bi bi-eye-fill me-1"></i> VER</button>
                  </div>
                </div>
              </div>

              <div class="modal fade" th:id="'modalProducto-' + ${producto.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-xl">
                  <div class="modal-content rounded-0 border-0" style="background-color: var(--bg-body);">
                    <div class="row g-0">
                      
                      <div class="col-md-5 bg-black d-flex align-items-center justify-content-center p-0 border-end border-dark">
                          <div style="width: 100%; height: 650px; overflow: hidden; position: relative;">
                             <img th:if="${producto.url_imagen != null}" th:src="@{${producto.url_imagen}}" style="width: 100%; height: 100%; object-fit: cover;" />
                             <img th:unless="${producto.url_imagen != null}" src="https://placehold.co/600x800/0a0a0a/333?text=SIN+IMAGEN" style="width: 100%; height: 100%; object-fit: cover;" />
                          </div>
                      </div>

                      <div class="col-md-7 p-4 p-lg-5 d-flex flex-column" style="background-color: var(--bg-card);">
                        <div class="d-flex justify-content-between align-items-start">
                           <span class="text-uppercase fw-bold small" style="color: var(--accent-secondary); letter-spacing: 2px;" th:text="${producto.categoria?.nombre}">Cat</span>
                           <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        
                        <h1 class="fw-black mt-3 mb-3 text-uppercase display-5 text-white" style="font-weight: 800; letter-spacing: -1px;" th:text="${producto.nombre}">NOMBRE</h1>
                        <p class="text-muted fs-5 mb-4" th:text="${producto.descripcion}">Descripción...</p>
                        
                        <h2 class="price-tag mb-4 display-6" th:id="'precioDisplay-' + ${producto.id}">
                           <span th:if="${producto.variantes != null and !producto.variantes.empty}">
                              <small class="text-muted fs-5 fw-normal">Desde</small> S/. <span th:text="${producto.precioMinimo}">0.00</span>
                           </span>
                           <span th:unless="${producto.variantes != null and !producto.variantes.empty}" class="text-danger">AGOTADO</span>
                        </h2>

                        <div class="mb-5">
                          <label class="fw-bold mb-3 small text-uppercase text-white" style="letter-spacing: 2px;"> <i class="bi bi-ruler-combined me-2" style="color: var(--accent-primary);"></i> TALLAS DISPONIBLES:</label>
                          <div class="talla-selector d-flex flex-wrap gap-2">
                            
                            <th:block th:if="${producto.variantes != null}" th:each="variante : ${producto.variantes}">
                              <div class="position-relative">
                                <input type="radio" 
                                       class="btn-check"
                                       th:name="'talla-grupo-' + ${producto.id}" 
                                       th:id="'var-' + ${variante.id}" 
                                       th:value="${variante.id}"
                                       th:data-precio="${variante.precio}"
                                       th:data-stock="${variante.stock}"
                                       th:disabled="${variante.stock <= 0}"
                                       th:onclick="'actualizarPrecioModal(' + ${producto.id} + ', this)'" 
                                       autocomplete="off" />
                                
                                <label th:for="'var-' + ${variante.id}" th:text="${variante.talla}">S</label>
                              </div>
                            </th:block>
                            
                            <div th:if="${producto.variantes == null or producto.variantes.empty}" class="text-danger small w-100 fw-bold">
                               <i class="bi bi-x-circle-fill"></i> SIN STOCK.
                            </div>
                          </div>
                          <div class="mt-3 small fw-bold" th:id="'stockDisplay-' + ${producto.id}" style="color: var(--accent-secondary);"></div>
                        </div>

                        <div class="mt-auto pt-4 border-top border-dark">
                           <form th:action="@{/carrito/agregar}" method="post">
                             <input type="hidden" name="varianteId" th:id="'inputVarianteId-' + ${producto.id}" required />
                             <input type="hidden" name="cantidad" value="1" />
                             
                             <button type="submit" class="btn w-100 py-3 rounded-0 fw-black fs-5 text-uppercase" 
                                     style="background: var(--accent-primary); color: black; border: none; font-weight: 900; letter-spacing: 1px;"
                                     th:id="'btnAgregar-' + ${producto.id}" disabled>
                               SELECCIONA TALLA
                             </button>
                           </form>
                        </div>
                        
                      </div>
                    </div>
                  </div>
                </div>
              </div> 
              </div> 
            
            <div th:if="${#lists.isEmpty(listaProductos)}" class="col-12 text-center py-5 my-5">
               <i class="bi bi-box-seam display-1 text-muted mb-3 d-block" style="opacity: 0.3;"></i>
               <h4 class="text-muted text-uppercase fw-bold" style="letter-spacing: 2px;">No se encontraron productos.</h4>
            </div>

          </div>
        </div>

        <div class="col-lg-3 order-lg-1 mb-5">
          <div class="filter-card p-4 sticky-top shadow-lg border-0" style="top: 100px; z-index: 10; background: #0a0a0a;">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-dark">
               <h5 class="fw-black m-0 text-white text-uppercase" style="font-weight: 800; letter-spacing: 1px;">
                   <i class="bi bi-funnel-fill me-2" style="color: var(--accent-primary);"></i> FILTRAR
               </h5>
               <button class="link-secondary-accent bg-transparent border-0 p-0 small text-uppercase fw-bold" id="btnLimpiarFiltros">Limpiar Todo</button>
            </div>

            <div class="mb-5">
              <h6 class="fw-bold small text-uppercase mb-3 text-white letter-spacing-1">Precio (S/.)</h6>
              <div class="row g-2">
                <div class="col-6">
                  <input type="number" class="form-control form-control-sm rounded-0" placeholder="MÍN" id="precioMin">
                </div>
                <div class="col-6">
                  <input type="number" class="form-control form-control-sm rounded-0" placeholder="MÁX" id="precioMax">
                </div>
              </div>
            </div>

            <div class="mb-5">
              <h6 class="fw-bold small text-uppercase mb-3 text-white letter-spacing-1">Tallas</h6>
              <div class="d-flex flex-wrap gap-2" id="filtroTallas">
                <span class="talla-badge rounded-0 fw-bold" data-talla="S">S</span>
                <span class="talla-badge rounded-0 fw-bold" data-talla="M">M</span>
                <span class="talla-badge rounded-0 fw-bold" data-talla="L">L</span>
                <span class="talla-badge rounded-0 fw-bold" data-talla="XL">XL</span>
              </div>
            </div>

            <div class="mb-5">
              <h6 class="fw-bold small text-uppercase mb-3 text-white letter-spacing-1">Categorías</h6>
              <div class="d-flex flex-column gap-3" id="filtroCategorias">
                 <div class="form-check" th:each="cat : ${listaCategorias}">
                    <input class="form-check-input rounded-0" type="checkbox" th:value="${cat.id}" th:id="'cat-' + ${cat.id}">
                    <label class="form-check-label text-muted text-uppercase fw-bold small" style="cursor: pointer;" th:for="'cat-' + ${cat.id}" th:text="${cat.nombre}">Nombre</label>
                 </div>
              </div>
            </div>

            <div class="form-check form-switch pt-3 border-top border-dark">
               <input class="form-check-input" type="checkbox" id="filtroStock" checked>
               <label class="form-check-label small text-white text-uppercase fw-bold" for="filtroStock">Solo Disponibles</label>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div th:replace="~{client/fragments/carrito :: carrito-offcanvas}"></div>
  <div th:replace="~{client/fragments/navbar :: loginModal}"></div>
  <div th:replace="~{client/fragments/navbar :: registerModal}"></div>
  <footer th:replace="~{client/fragments/footer :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // EL JAVASCRIPT SE MANTIENE EXACTAMENTE IGUAL QUE TU VERSIÓN ANTERIOR
    document.addEventListener("DOMContentLoaded", function () {
      
      const buscador = document.getElementById("buscadorProductos");
      const precioMinInput = document.getElementById("precioMin");
      const precioMaxInput = document.getElementById("precioMax");
      const stockCheck = document.getElementById("filtroStock");
      const btnLimpiar = document.getElementById("btnLimpiarFiltros");
      
      if(buscador) buscador.addEventListener("input", filtrar);
      if(precioMinInput) precioMinInput.addEventListener("input", filtrar);
      if(precioMaxInput) precioMaxInput.addEventListener("input", filtrar);
      if(stockCheck) stockCheck.addEventListener("change", filtrar);
      
      document.querySelectorAll(".talla-badge").forEach(badge => {
        badge.addEventListener("click", function() {
          this.classList.toggle("active");
          filtrar();
        });
      });

      document.querySelectorAll("#filtroCategorias input").forEach(ch => {
        ch.addEventListener("change", filtrar);
      });

      function filtrar() {
        const texto = buscador ? buscador.value.toLowerCase().trim() : "";
        const min = parseFloat(precioMinInput?.value) || 0;
        const max = parseFloat(precioMaxInput?.value) || 999999;
        const soloStock = stockCheck ? stockCheck.checked : false;

        const tallasActivas = Array.from(document.querySelectorAll(".talla-badge.active")).map(b => b.dataset.talla);
        const catsActivas = Array.from(document.querySelectorAll("#filtroCategorias input:checked")).map(i => i.value);

        document.querySelectorAll(".product-card-filter").forEach(card => {
          const contenedor = card.closest(".col-lg-4"); 
          
          const nombre = (card.dataset.nombre || "").toString();
          const precio = parseFloat(card.dataset.precio) || 0;
          const stock = parseInt(card.dataset.stock) || 0;
          const catId = (card.dataset.categoria || "").toString();
          const tallasProd = (card.dataset.tallas || "").split(",");

          let visible = true;

          if (texto && !nombre.includes(texto)) visible = false;
          if (visible && (precio < min || precio > max)) visible = false;
          if (visible && soloStock && stock <= 0) visible = false;
          if (visible && catsActivas.length > 0 && !catsActivas.includes(catId)) visible = false;
          if (visible && tallasActivas.length > 0) {
             const tieneTalla = tallasProd.some(t => tallasActivas.includes(t));
             if (!tieneTalla) visible = false;
          }

          if(contenedor) {
             contenedor.style.display = visible ? "block" : "none";
          }
        });
      }

      if(btnLimpiar) {
        btnLimpiar.addEventListener("click", () => {
          if(buscador) buscador.value = "";
          if(precioMinInput) precioMinInput.value = "";
          if(precioMaxInput) precioMaxInput.value = "";
          if(stockCheck) stockCheck.checked = true;
          document.querySelectorAll(".talla-badge").forEach(b => b.classList.remove("active"));
          document.querySelectorAll("#filtroCategorias input").forEach(c => c.checked = false);
          filtrar();
        });
      }
    });

    function actualizarPrecioModal(productoId, inputRadio) {
        const precio = parseFloat(inputRadio.dataset.precio);
        const stock = parseInt(inputRadio.dataset.stock);
        const varianteId = inputRadio.value;

        const display = document.getElementById('precioDisplay-' + productoId);
        const btn = document.getElementById('btnAgregar-' + productoId);
        const hiddenInput = document.getElementById('inputVarianteId-' + productoId);
        const stockDisplay = document.getElementById('stockDisplay-' + productoId);

        display.innerHTML = '<small class="text-muted fs-5 fw-normal">Precio: </small> S/. ' + precio.toFixed(2);
        // Eliminamos clases de color para que tome el color por defecto del CSS (Amarillo)
        display.classList.remove('text-danger');
        
        hiddenInput.value = varianteId;

        if(stockDisplay) {
            stockDisplay.innerHTML = `<i class="bi bi-box-seam-fill me-1"></i> Stock disponible: ${stock}`;
        }

        if (stock > 0) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-bag-plus-fill me-2"></i> AGREGAR AL CARRITO';
            btn.style.opacity = "1";
            btn.style.cursor = "pointer";
        } else {
            btn.disabled = true;
            btn.innerHTML = 'AGOTADO';
            btn.style.opacity = "0.5";
            btn.style.cursor = "not-allowed";
        }
    }
  </script>
</body>
</html>
