<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <link rel="stylesheet" th:href="@{/css/client/base.css}">
    <link rel="stylesheet" th:href="@{/css/client/productos.css}">

</head>
<body>
    <header th:replace="client/fragments/navbar :: navbar"></header>

    <section class="catalogo-section py-5 bg-dark text-white">
        <div class="banner-top text-center py-5 text-white fw-bold"> ¡ENCUENTRA TU ESTILO CON NUESTRAS NOVEDADES!
        </div>
        <div class="container mt-4 mb-4">
            <div class="row align-items-center">
                <div class="col-lg-6 col-md-12">
                    <h2 class="text-uppercase fw-bold catalogo-title text-white">Catalogo</h2>
                </div>
                <div class="col-lg-6 col-md-12">
                    <div class="input-group custom-search-bar">
                        <input type="text" class="form-control custom-search-input" placeholder="BUSCAR PRODUCTOS">
                        <button class="btn custom-search-btn" type="button">
                            <span class="material-symbols-outlined">search</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                
                <div class="col-lg-9 col-md-12">
                    <div class="row">
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P1.png}" class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Casaca de cuero</h6>
                                    <p class="card-price fw-bold">S/.100.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P2.png}" class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Overside de new york</h6>
                                    <p class="card-price fw-bold">S/.70.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P3.png}" class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Chaqueta</h6>
                                    <p class="card-price fw-bold">S/.250.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P4.png}" class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Polera</h6>
                                    <p class="card-price fw-bold">S/.150.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P5.png}" class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Jogger</h6>
                                    <p class="card-price fw-bold">S/.90.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card custom-product-card bg-black text-white">
                                <img th:src="@{/Img/P6.png}" class="card-img-top" alt="Producto 6">
                                <div class="card-body">
                                    <h6 class="card-title fw-bold">Top</h6>
                                    <p class="card-price fw-bold">S/.60.00</p>
                                    <button class="btn w-100 product-add-btn">AGREGAR AL CARRITO</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 d-none d-lg-block">
                    <div class="filter-sidebar p-3">
                        <h5 class="fw-bold mb-4 filter-title-prueba">PRUEBATE TU PRENDA FAVORITA AQUI</h5>
                        
                        <h5 class="fw-bold mb-3 filter-subtitle">FILTRADO</h5>
                        <button class="btn btn-sm filter-limpiar-btn mb-4">LIMPIAR</button>

                        <div class="filter-group mb-4">
                            <h6 class="text-uppercase fw-bold mb-2 filter-subtitle-small">PRECIO</h6>
                            <div class="d-flex justify-content-between">
                                <input type="number" class="form-control custom-filter-input" placeholder="MINIMO">
                                <input type="number" class="form-control custom-filter-input" placeholder="MAXIMO">
                            </div>
                        </div>

                        <div class="filter-group mb-4">
                            <h6 class="text-uppercase fw-bold mb-2 filter-subtitle-small">TALLAS</h6>
                            <p class="mb-0 filter-label-tallas">S M L</p> 
                        </div>

                        <div class="filter-group mb-4">
                            <h6 class="text-uppercase fw-bold mb-2 filter-subtitle-small">CANTIDAD</h6>
                            <div class="d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="filter-label">S</span>
                                    <input type="checkbox" class="form-check-input custom-checkbox">
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="filter-label">M</span>
                                    <input type="checkbox" class="form-check-input custom-checkbox">
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="filter-label">L</span>
                                    <input type="checkbox" class="form-check-input custom-checkbox">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </section>
    
    <div th:replace="client/fragments/navbar :: loginModal"></div>
    <div th:replace="client/fragments/navbar :: registerModal"></div>
    <div th:replace="client/fragments/navbar :: carritoOffcanvas"></div>

    <footer th:replace="client/fragments/footer :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  await fetch("/logout", { method: "POST" });
  window.location.reload(); // recarga la página actual
});

    </script>
</body>
</html>
