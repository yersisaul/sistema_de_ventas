<!-- client/fragments/carrito-offcanvas.html -->
<div th:fragment="carrito-offcanvas">
  <div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="carritoOffcanvas"
    aria-labelledby="carritoOffcanvasLabel"
  >
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title" id="carritoOffcanvasLabel">
        <i class="bi bi-cart3 me-2"></i>Mi Carrito
      </h5>
      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas"
        aria-label="Cerrar"
      ></button>
    </div>
    <div class="offcanvas-body p-0">
      <!-- 🛒 LISTA DE PRODUCTOS -->
      <div id="carritoItems" class="h-100 d-flex flex-column">
        <!-- Items del carrito -->
        <div
          class="flex-grow-1 overflow-auto"
          style="max-height: 60vh"
          id="carritoContenido"
        >
          <!-- Los items se cargarán dinámicamente aquí -->
          <div class="text-center py-5" id="carritoVacio">
            <i class="bi bi-cart-x display-4 text-muted mb-3"></i>
            <p class="text-muted">Tu carrito está vacío</p>
            <a
              th:href="@{/productos}"
              class="btn btn-outline-dark btn-sm"
              data-bs-dismiss="offcanvas"
            >
              <i class="bi bi-arrow-left me-1"></i>Ir a productos
            </a>
          </div>
        </div>

        <!-- 📋 RESUMEN DEL CARRITO -->
        <div
          class="border-top p-3 bg-light"
          id="carritoResumen"
          style="display: none"
        >
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <strong id="carritoSubtotal">S/. 0.00</strong>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Envío:</span>
            <strong id="carritoEnvio">S/. 0.00</strong>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span>Total:</span>
            <strong class="fs-5 text-dark" id="carritoTotal">S/. 0.00</strong>
          </div>

          <!-- BOTONES DE ACCIÓN -->
          <div class="d-grid gap-2">
            <a
              th:href="@{/carrito}"
              class="btn btn-dark"
              data-bs-dismiss="offcanvas"
            >
              <i class="bi bi-eye me-1"></i>Ver carrito completo
            </a>
            <button class="btn btn-outline-dark" data-bs-dismiss="offcanvas">
              <i class="bi bi-arrow-left me-1"></i>Seguir comprando
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script para manejar el carrito -->
  <script>
    // 🛒 SISTEMA DE CARRITO GLOBAL
    class CarritoManager {
      constructor() {
        this.carrito = JSON.parse(localStorage.getItem("carritoMambo")) || [];
        this.actualizarContador();
        this.cargarCarritoOffcanvas();
      }

      // 🔄 AGREGAR PRODUCTO AL CARRITO
      agregarProducto(producto, variante, cantidad = 1) {
        const itemExistente = this.carrito.find(
          (item) =>
            item.productoId === producto.id && item.varianteId === variante.id
        );

        if (itemExistente) {
          itemExistente.cantidad += cantidad;
        } else {
          this.carrito.push({
            productoId: producto.id,
            varianteId: variante.id,
            nombre: producto.nombre,
            imagen: producto.imagen,
            precio: variante.precio,
            talla: variante.talla,
            color: variante.color,
            cantidad: cantidad,
            sku: producto.sku,
            variante: variante,
          });
        }

        this.guardarCarrito();
        this.actualizarContador();
        this.cargarCarritoOffcanvas();
        this.mostrarNotificacion(`${producto.nombre} agregado al carrito`);
      }

      // 🔄 ELIMINAR PRODUCTO DEL CARRITO
      eliminarProducto(index) {
        if (confirm("¿Eliminar este producto del carrito?")) {
          this.carrito.splice(index, 1);
          this.guardarCarrito();
          this.actualizarContador();
          this.cargarCarritoOffcanvas();
        }
      }

      // 🔄 ACTUALIZAR CANTIDAD
      actualizarCantidad(index, nuevaCantidad) {
        nuevaCantidad = parseInt(nuevaCantidad);

        if (isNaN(nuevaCantidad) || nuevaCantidad < 1 || nuevaCantidad > 10) {
          nuevaCantidad = 1;
        }

        this.carrito[index].cantidad = nuevaCantidad;
        this.guardarCarrito();
        this.actualizarContador();
        this.cargarCarritoOffcanvas();
      }

      // 🔄 CAMBIAR CANTIDAD (incremento/decremento)
      cambiarCantidad(index, delta) {
        const nuevoValor = this.carrito[index].cantidad + delta;

        if (nuevoValor < 1 || nuevoValor > 10) return;

        this.carrito[index].cantidad = nuevoValor;
        this.guardarCarrito();
        this.actualizarContador();
        this.cargarCarritoOffcanvas();
      }

      // 💾 GUARDAR EN LOCALSTORAGE
      guardarCarrito() {
        localStorage.setItem("carritoMambo", JSON.stringify(this.carrito));
      }

      // 🔢 ACTUALIZAR CONTADOR EN NAVBAR
      actualizarContador() {
        const totalItems = this.carrito.reduce(
          (total, item) => total + item.cantidad,
          0
        );
        const contadores = document.querySelectorAll(".carrito-contador");

        contadores.forEach((contador) => {
          contador.textContent = totalItems;
          contador.style.display = totalItems > 0 ? "block" : "none";
        });
      }

      // 🎴 CARGAR CARRITO EN OFFCANVAS
      cargarCarritoOffcanvas() {
        const carritoContenido = document.getElementById("carritoContenido");
        const carritoVacio = document.getElementById("carritoVacio");
        const carritoResumen = document.getElementById("carritoResumen");

        if (this.carrito.length === 0) {
          carritoVacio.style.display = "block";
          carritoResumen.style.display = "none";
          carritoContenido.innerHTML = "";
          return;
        }

        carritoVacio.style.display = "none";
        carritoResumen.style.display = "block";

        let html = "";
        this.carrito.forEach((item, index) => {
          const subtotal = item.precio * item.cantidad;

          html += `
          <div class="carrito-item p-3 border-bottom">
            <div class="d-flex gap-3">
              <!-- Imagen -->
              <div style="width: 80px; height: 80px; flex-shrink: 0;">
                <img src="${item.imagen}" alt="${item.nombre}" 
                     class="w-100 h-100 object-fit-cover rounded" 
                     style="border: 1px solid #dee2e6;">
              </div>
              
              <!-- Información -->
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                  <h6 class="mb-1" style="font-size: 0.9rem;">${
                    item.nombre
                  }</h6>
                  <button class="btn btn-link text-danger p-0" onclick="carritoManager.eliminarProducto(${index})">
                    <i class="bi bi-trash" style="font-size: 0.8rem;"></i>
                  </button>
                </div>
                
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="badge bg-secondary" style="font-size: 0.7rem;">${
                    item.talla
                  }</span>
                  <span class="badge bg-light text-dark" style="font-size: 0.7rem;">${
                    item.color
                  }</span>
                </div>
                
                <!-- Cantidad y Precio -->
                <div class="d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-outline-secondary p-1" 
                            onclick="carritoManager.cambiarCantidad(${index}, -1)" 
                            style="width: 25px; height: 25px; line-height: 1;">
                      <i class="bi bi-dash"></i>
                    </button>
                    <span style="width: 30px; text-align: center;">${
                      item.cantidad
                    }</span>
                    <button class="btn btn-sm btn-outline-secondary p-1" 
                            onclick="carritoManager.cambiarCantidad(${index}, 1)" 
                            style="width: 25px; height: 25px; line-height: 1;">
                      <i class="bi bi-plus"></i>
                    </button>
                  </div>
                  <div>
                    <strong class="text-dark">S/. ${subtotal.toFixed(
                      2
                    )}</strong>
                    <small class="text-muted d-block" style="font-size: 0.75rem;">S/. ${item.precio.toFixed(
                      2
                    )} c/u</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        });

        carritoContenido.innerHTML = html;
        this.actualizarResumen();
      }

      // 📋 ACTUALIZAR RESUMEN DEL CARRITO
      actualizarResumen() {
        const subtotal = this.carrito.reduce(
          (sum, item) => sum + item.precio * item.cantidad,
          0
        );
        const envio = subtotal > 100 ? 0 : 15;
        const total = subtotal + envio;

        document.getElementById(
          "carritoSubtotal"
        ).textContent = `S/. ${subtotal.toFixed(2)}`;
        document.getElementById(
          "carritoEnvio"
        ).textContent = `S/. ${envio.toFixed(2)}`;
        document.getElementById(
          "carritoTotal"
        ).textContent = `S/. ${total.toFixed(2)}`;
      }

      // 🔔 MOSTRAR NOTIFICACIÓN
      mostrarNotificacion(mensaje) {
        // Crear notificación
        const notificacion = document.createElement("div");
        notificacion.className =
          "position-fixed bottom-0 end-0 m-3 p-3 bg-success text-white rounded shadow-lg";
        notificacion.style.zIndex = "1060";
        notificacion.style.maxWidth = "300px";
        notificacion.innerHTML = `
        <div class="d-flex align-items-center">
          <i class="bi bi-check-circle-fill me-2"></i>
          <span>${mensaje}</span>
        </div>
      `;

        document.body.appendChild(notificacion);

        // Remover después de 3 segundos
        setTimeout(() => {
          notificacion.remove();
        }, 3000);
      }

      // 🆓 VACIAR CARRITO
      vaciarCarrito() {
        if (confirm("¿Estás seguro de vaciar el carrito?")) {
          this.carrito = [];
          this.guardarCarrito();
          this.actualizarContador();
          this.cargarCarritoOffcanvas();
        }
      }

      // 📄 OBTENER RESUMEN PARA CHECKOUT
      obtenerResumen() {
        const subtotal = this.carrito.reduce(
          (sum, item) => sum + item.precio * item.cantidad,
          0
        );
        const envio = subtotal > 100 ? 0 : 15;
        const total = subtotal + envio;

        return {
          items: this.carrito,
          subtotal: subtotal,
          envio: envio,
          total: total,
          cantidadTotal: this.carrito.reduce(
            (sum, item) => sum + item.cantidad,
            0
          ),
        };
      }
    }

    // 🌍 INSTANCIA GLOBAL DEL CARRITO
    window.carritoManager = new CarritoManager();
  </script>
</div>
