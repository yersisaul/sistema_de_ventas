<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <div th:fragment="client_navbar"> 
    
    <nav class="sidebar d-none d-md-flex flex-column align-items-center py-4" 
         style="background-color: #1a1a1a; width: 100px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 1000;">
      
      <div class="logo mb-5 text-white fw-bold fs-4">M.</div>

      <a th:href="@{/client/mispedidos}" 
         th:classappend="${activePage == 'mispedidos'} ? 'active' : ''" 
         class="nav-item text-white mb-4 d-flex flex-column align-items-center text-decoration-none" 
         title="Mis Pedidos">
         <i class="bi bi-bag-check fs-4 mb-1"></i>
         <span style="font-size: 10px;">PEDIDOS</span>
      </a>

      <a th:href="@{/client/configuracion}" 
         th:classappend="${activePage == 'configuracion'} ? 'active' : ''" 
         class="nav-item text-white mb-4 d-flex flex-column align-items-center text-decoration-none" 
         title="Configuración">
         <i class="bi bi-gear fs-4 mb-1"></i>
         <span style="font-size: 10px;">PERFIL</span>
      </a>

      <a th:href="@{/}" class="nav-item text-white mb-4 d-flex flex-column align-items-center text-decoration-none" title="Tienda">
         <i class="bi bi-shop fs-4 mb-1"></i>
         <span style="font-size: 10px;">TIENDA</span>
      </a>

      <div class="mt-auto">
        <a th:href="@{/logout}" class="text-white d-flex flex-column align-items-center text-decoration-none" title="Salir">
          <i class="bi bi-box-arrow-right fs-4 mb-1"></i>
          <span style="font-size: 10px;">SALIR</span>
        </a>
      </div>
    </nav>

    <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sidebarOffcanvas">
      <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title">MI CUENTA</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      
      <div class="offcanvas-body d-flex flex-column gap-3 align-items-start p-0">
        
        <a th:href="@{/client/mispedidos}" class="text-white text-decoration-none w-100 py-3 ps-4 d-flex align-items-center border-bottom"
           th:classappend="${activePage == 'mispedidos'} ? 'bg-secondary' : ''">
          <i class="bi bi-bag-check me-3"></i> Mis Pedidos
        </a>
        
        <a th:href="@{/client/configuracion}" class="text-white text-decoration-none w-100 py-3 ps-4 d-flex align-items-center border-bottom"
           th:classappend="${activePage == 'configuracion'} ? 'bg-secondary' : ''">
          <i class="bi bi-gear me-3"></i> Configuración
        </a>
        
        <a th:href="@{/}" class="text-white text-decoration-none w-100 py-3 ps-4 d-flex align-items-center border-bottom">
          <i class="bi bi-shop me-3"></i> Ir a la Tienda
        </a>
        
        <a th:href="@{/logout}" class="text-white text-decoration-none w-100 py-3 ps-4 d-flex align-items-center mt-auto border-top border-secondary">
          <i class="bi bi-box-arrow-right me-3"></i> Cerrar Sesión
        </a>
      </div>
    </div>

  </div>
</body>
</html>
