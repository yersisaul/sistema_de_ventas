<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <link rel="stylesheet" th:href="@{/static/css/client/base.css}">
    <link rel="stylesheet" th:href="@{/static/css/client/contactanos.css}">
</head>
<body>
    <header th:replace="client/fragments/navbar :: navbar"></header>

    <main class="contactanos-section text-center text-white pt-5 pb-5" style="min-height: 80vh;">
        <div class="container pt-5 pb-5">
            <h1 class="contactanos-title display-3 fw-bold mt-5 mb-4">Contáctanos</h1>
            <div class="underline-divisor mb-5 mx-auto"></div>
            <h3 class="fw-normal mb-4">Quieres ponerte en contacto con nosotros?</h3>
            <p class="contactanos-info h5 fw-bold mb-5">
                Escríbenos o llámanos al número 
                <span class="text-warning">+51912321878</span> 
                o envíanos un correo electrónico a 
                <span class="text-warning">MamboClothing@gmail.com</span>
            </p>
        </div>
        <div class="row justify-content-center mt-5">
            <div class="col-lg-8 col-md-10">
                <form class="contact-form">
                    
                    <div class="mb-4">
                        <input type="text" class="form-control custom-form-input" id="nombreContacto" placeholder="Nombre">
                    </div>

                    <div class="mb-4">
                        <input type="email" class="form-control custom-form-input" id="correoContacto" placeholder="Correo electrónico">
                    </div>

                    <div class="mb-4">
                        <textarea class="form-control custom-form-input" id="mensajeContacto" rows="5" placeholder="Mensaje"></textarea>
                    </div>

                    <button type="submit" class="btn btn-block w-100 custom-send-btn py-3 mt-4">
                        Enviar
                    </button>
                    
                </form>
            </div>
        </div>
    </main>
    
    <div th:replace="client/fragments/navbar :: loginModal"></div>
    <div th:replace="client/fragments/navbar :: registerModal"></div>
    <div th:replace="client/fragments/navbar :: carritoOffcanvas"></div>

    <footer th:replace="client/fragments/footer :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
