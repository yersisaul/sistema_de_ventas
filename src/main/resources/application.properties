spring.application.name=springboot_app

spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_ventas_mambo
spring.datasource.username=postgres
spring.datasource.password=admin1234

# Opcional pero útil
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Log's
logging.level.com.integrador.sistema_de_ventas=DEBUG
logging.level.org.springframework.security=DEBUG

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Configuración de recursos estáticos
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/

